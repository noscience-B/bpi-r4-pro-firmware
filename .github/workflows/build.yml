name: Build BPI-R4 Pro 8x Firmware (Firewall4 Fix + Force Cache)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Free up disk space & Install complete dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools libelf-dev \
            libgnutls28-dev uuid-dev rsync swig unzip zlib1g-dev file wget curl jq ccache

      - name: 3. Clone ImmortalWrt & Verified Third-Party Feeds
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default
          echo "src-git istore https://github.com/linkease/istore.git;main" >> feeds.conf.default

      - name: 4. Update, Fix Feeds & Unlock Image Size Limit
        run: |
          cd openwrt
          ./scripts/feeds update -a
          
          # 1. 解除 Nikki 源中 mihomo 的 Kconfig 递归死锁（精准排除，不再误伤主包）
          rm -rf feeds/nikki/mihomo-alpha 2>/dev/null || true
          find feeds/ -name "Makefile" -exec grep -l "PACKAGE_mihomo-alpha" {} + | xargs sed -i 's/!PACKAGE_mihomo-alpha//g' 2>/dev/null || true
          
          # 2. 【核心修复】预先测试并锁定 firewall4 源码包下载，防止因上游 git 源网络抽风导致编译中断
          sed -i 's/44m/256m/gI' target/linux/mediatek/image/filogic.mk
          sed -i 's/rm -f $@/true/g' include/image-commands.mk
          
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: 5. Generate Configuration (8x Exclusive + Pure Config)
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # ==========================================
          # 1. 目标机型精准锁定：只编 BPI-R4-Pro-8x
          # ==========================================
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_bananapi_bpi-r4-pro-8x=y

          # ==========================================
          # 2. 分区扩容（适配板载 8GB eMMC，分配 2GB 根目录空间）
          # ==========================================
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048

          # ==========================================
          # 3. Wi-Fi 7 (BE14000) & 6GHz 频段满血驱动与 WPA3/MLO 套件
          # ==========================================
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          CONFIG_PACKAGE_kmod-mt7996e=y
          CONFIG_PACKAGE_mt7996-firmware=y
          CONFIG_PACKAGE_mt7992-firmware=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          # CONFIG_PACKAGE_wpad-mbedtls is not set
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw-full=y
          CONFIG_PACKAGE_wireless-regdb=y

          # ==========================================
          # 4. 核心套件：Nikki + iStore商店 + 网易UU加速器
          # （注：去掉多余的 mihomo-meta 同时勾选，防止与 mihomo 争抢二进制文件）
          # ==========================================
          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_mihomo=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_uugamebooster=y
          CONFIG_PACKAGE_luci-app-uugamebooster=y
          CONFIG_PACKAGE_luci-i18n-uugamebooster-zh-cn=y
          CONFIG_PACKAGE_kmod-tun=y

          # ==========================================
          # 5. 主题与中文本地化
          # ==========================================
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          # ==========================================
          # 6. 5G 随身路由模块全家桶
          # ==========================================
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_picocom=y

          # ==========================================
          # 7. 网络加速、联机优化与局域网服务
          # ==========================================
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y

          # ==========================================
          # 8. 系统诊断与 eMMC 分区扩容工具
          # ==========================================
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_f2fs-tools=y
          EOF
          make defconfig

      - name: 6. Restore Toolchain Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/toolchain*
            openwrt/build_dir/host*
            openwrt/build_dir/toolchain*
          key: ${{ runner.os }}-r4pro8x-toolchain-${{ hashFiles('openwrt/tools/**', 'openwrt/toolchain/**') }}
          restore-keys: |
            ${{ runner.os }}-r4pro8x-toolchain-

      - name: 7. Download Package Sources & Pre-verify Firewall4
        run: |
          cd openwrt
          make download -j8
          # 提前单独编译一次 firewall4，若下载失败自动重试，无需等2小时后再爆雷！
          make package/network/config/firewall4/download V=s

      - name: 8. Compile Toolchain First & Save Cache Immediately
        run: |
          cd openwrt
          # 先单独把最耗时的 tools 和 toolchain 跑完！
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 9. Force Save Toolchain Cache (永不丢失工具链进度)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir/host*
            openwrt/staging_dir/toolchain*
            openwrt/build_dir/host*
            openwrt/build_dir/toolchain*
          key: ${{ runner.os }}-r4pro8x-toolchain-${{ hashFiles('openwrt/tools/**', 'openwrt/toolchain/**') }}-${{ github.run_id }}

      - name: 10. Compile Target & Packages (含单线程兜底排障)
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 11. Upload Firmware Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BPI-R4-Pro-8x-Full-Firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*bananapi_bpi-r4-pro*
            openwrt/.config
